<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>六一 · 只给你过儿童节 🎈</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Serif SC','ZCOOL KuaiLe',cursive;
  background:#050510;
  color:#ffeef6;
  overflow-x:hidden;
}

#starCanvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:-2;
}

.overlay{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  background:radial-gradient(ellipse at center,rgba(20,10,40,.3) 0%,rgba(5,5,16,.85) 100%);
  z-index:-1;
}

/* 开场 */
#landing{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  animation:fadeIn 2s ease;
}

#landing h1{
  font-size:clamp(1.8rem,6vw,3rem);
  text-shadow:0 0 30px #ff8fab;
}

#landing p{
  margin-top:18px;
  font-size:1.1rem;
  opacity:.85;
}

.btn{
  padding:14px 38px;
  margin-top:28px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#ff8fab,#c084fc);
  color:#fff;
  font-size:1.1rem;
  cursor:pointer;
  letter-spacing:2px;
  transition:.2s;
}

.btn:hover{
  transform:scale(1.06);
  box-shadow:0 0 30px #c084fc66;
}

/* 主内容 */
#main{
  display:none;
  padding:50px 20px 80px;
  text-align:center;
}

.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:28px 22px;
  max-width:420px;
  margin:24px auto;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.card h2{
  font-size:1.3rem;
  margin-bottom:12px;
  color:#ffb6c1;
}

.photo{
  width:160px;
  height:160px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ff8fab55;
  box-shadow:0 0 40px #ff8fab44;
  margin-bottom:14px;
}

#typing{
  min-height:100px;
  font-size:1.15rem;
  line-height:2;
  white-space:pre-wrap;
  color:#ffe0ec;
}

.voucher{
  margin:8px 0;
  font-size:1rem;
  background:rgba(255,255,255,.07);
  border-radius:12px;
  padding:8px 14px;
  display:inline-block;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<!-- 星空 -->
<canvas id="starCanvas"></canvas>
<div class="overlay"></div>

<!-- ✅ 背景音乐（已修复） -->
<audio id="bgm" loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<!-- 开场 -->
<div id="landing">
  <h1>🎈 欢迎来到<br>你的专属儿童节</h1>
  <p>—— 给 <span style="color:#ffb6c1">❤️刘怡❤️</span> ——</p>
  <button class="btn" onclick="enter()">点我开启 ✨</button>
</div>

<!-- 主内容 -->
<div id="main">
  <div class="card">
    <img class="photo" src="photo.jpg" alt="我们的照片"
         onerror="this.outerHTML='<div style=&quot;width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,#ff8fab,#c084fc);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:.9rem&quot;>你的照片</div>'">
    <h2>🧸 今日身份卡 · <span style="color:#ffe0ec">❤️刘怡❤️</span></h2>
    <p>你是 <strong>永远的 15 岁小朋友</strong></p>
    <p>特长：撒娇 · 发呆 · 被无条件宠爱</p>
    <p>任务：今天只负责 <span style="color:#ffb6c1">开心 🍭</span></p>
  </div>

  <div class="card">
    <h2>💌 给小朋友的一封信</h2>
    <div id="typing"></div>
  </div>

  <div class="card">
    <h2>🎁 儿童节专属兑换券</h2>
    <div class="voucher">🍦 冰淇淋无限畅吃券(来例假时不可以使用)</div><br>
    <div class="voucher">🎮 游戏 / 剧集陪玩券 × 全天</div><br>
    <div class="voucher">🤗 拥抱安慰券 × ∞</div>
  </div>

  <button class="btn" onclick="alert('今天你最大，我永远宠你爱你 🎀')">戳我领糖果</button>
</div>

<script>
/* ===== 进入 + 音乐（已修复无声音问题）===== */
function enter(){
  document.getElementById('landing').style.display = 'none';
  document.getElementById('main').style.display = 'block';

  const bgm = document.getElementById('bgm');
  bgm.volume = 0.35;

  const playPromise = bgm.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      document.body.addEventListener('click', () => bgm.play(), { once: true });
    });
  }

  typeWriter();
}

/* ===== 打字机情话 ===== */
const loveText =
"以前我也以为，长大是为了变得懂事、变得无坚不摧。\n" +
"直到遇见你，我才明白——\n" +
"长大，是为了能名正言顺地，保护一个不想长大的你。\n\n" +
"所以今天，我把全世界都关在门外，\n" +
"只留一盏灯、一颗糖，和一辈子的时间。\n\n" +
"你永远可以躲进我怀里当小朋友，\n" +
"撒娇也好，任性也罢，\n" +
"我都接得住，也都愿意宠。\n\n" +
"六一快乐，我的女朋友。\n" +
"不是今天才宠你，是以后每一天。";

let ti = 0;
function typeWriter(){
  if(ti < loveText.length){
    document.getElementById('typing').innerHTML += loveText[ti++];
    setTimeout(typeWriter, 65);
  }
}

/* ===== 星空 ===== */
const cvs = document.getElementById('starCanvas');
const ctx = cvs.getContext('2d');
let W, H;

function resize(){
  W = cvs.width = innerWidth;
  H = cvs.height = innerHeight;
}
resize();
window.addEventListener('resize', resize);

const stars = [];
for(let i=0;i<260;i++){
  stars.push({
    x:Math.random()*1920,
    y:Math.random()*1080,
    r:Math.random()*.9+.2,
    a:Math.random(),
    da:(Math.random()-.5)*.015
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.a+=s.da;
    if(s.a>1||s.a<.2)s.da=-s.da;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,240,255,${s.a})`;
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
